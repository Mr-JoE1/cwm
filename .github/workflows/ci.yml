name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Check gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: E2E tests
        if: matrix.os == 'ubuntu-latest'
        run: go test -tags e2e ./test/

      - name: Cross-build check (windows/amd64)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: GOOS=windows GOARCH=amd64 go build ./...

      - name: Cross-build check (linux/arm64)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: GOOS=linux GOARCH=arm64 go build ./...
