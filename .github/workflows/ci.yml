name: CI

on:
  push:
    # feature and fix branches too, so a pushed branch shows CI before its PR (D39)
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Check gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: E2E tests
        if: matrix.os == 'ubuntu-latest'
        run: go test -tags e2e ./test/

      - name: Cross-build check (windows/amd64)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: GOOS=windows GOARCH=amd64 go build ./...

      - name: Cross-build check (linux/arm64)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: GOOS=linux GOARCH=arm64 go build ./...

      - name: Cross-build + vet (darwin, windows)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=amd64 go build ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...

      - name: Dashboard contrast + DOM sinks (D68)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          node scripts/contrast-check.js
          if grep -nE 'innerHTML|insertAdjacentHTML|outerHTML|document\.write' internal/gui/web/*.js; then
            echo "::error::HTML-parsing DOM sink in internal/gui/web"; exit 1
          fi

      - name: Legacy bash kit
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash tests/test.sh

      - name: Shellcheck installers
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: shellcheck -s sh scripts/install.sh && shellcheck scripts/test-install.sh

      - name: Installer harness (install.sh + install.ps1 via pwsh)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/test-install.sh

      - name: install.ps1 parses under Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          foreach ($f in @('install.ps1', 'test-install-windows.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\$f", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error "${f}:$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
            Write-Host "$f parses under PowerShell $($PSVersionTable.PSVersion)"
          }

      # The v0.6.0 tester's shell (SPEC-V0.6.1): install.ps1 end to end
      # under Windows PowerShell 5.1, plus the piped-output mojibake check.
      - name: Installer harness (install.ps1 under Windows PowerShell 5.1)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-install-windows.ps1
