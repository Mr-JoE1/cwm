name: 🐛 Bug report
description: Something in cwm doesn't work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Report it [privately](https://github.com/Mr-JoE1/cwm/security/advisories/new), not here.
        Please search [existing issues](https://github.com/Mr-JoE1/cwm/issues?q=is%3Aissue) first.

  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      placeholder: |
        What you did and what you saw, in 2–3 lines.
        e.g. "Opened the dashboard; Health says claude was not found, but the VS Code extension works."
    validations:
      required: true

  - type: textarea
    id: debug
    attributes:
      label: Debug logs
      description: In the dashboard click **report a bug** (or run `cwm debug --copy`) and paste here. It is redacted automatically; glance over it before posting.
      render: text
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: cwm version
      description: Filled in by the dashboard's **report a bug**; otherwise the output of `cwm version`.
      placeholder: "cwm 0.8.1 (windows/amd64, abc1234)"
    validations:
      required: false
