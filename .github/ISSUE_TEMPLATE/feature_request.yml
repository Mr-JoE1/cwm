name: ✨ Feature request
description: Suggest an idea or improvement for cwm.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        It may already be planned (or ruled out): see the [Roadmap](https://github.com/Mr-JoE1/cwm/wiki/Roadmap).
        Please search [existing issues](https://github.com/Mr-JoE1/cwm/issues?q=is%3Aissue) first.

  - type: textarea
    id: idea
    attributes:
      label: What would you like cwm to do?
      placeholder: What you are trying to do and what gets in the way today, in 2–3 lines.
    validations:
      required: true

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Ideas for how it could work, workarounds you use today, or links.
    validations:
      required: false
